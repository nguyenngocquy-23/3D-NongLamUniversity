name: Performance Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "3d-virtual-nlu-api/**"
      - "3d-virtual-nlu/**"
      - "k6-performance-tests/**"
  pull_request:
    branches: [main, develop]
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of performance test to run"
        required: true
        default: "basic"
        type: choice
        options:
          - basic
          - stress
          - spike
          - soak

jobs:
  performance-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        test-scenario:
          - basic-load-test
          - stress-test
          - spike-test
          - soak-test
        include:
          - test-scenario: basic-load-test
            test-file: scenarios/basic-load-test.js
            max-duration: 10m
          - test-scenario: stress-test
            test-file: scenarios/stress-test.js
            max-duration: 20m
          - test-scenario: spike-test
            test-file: scenarios/spike-test.js
            max-duration: 15m
          - test-scenario: soak-test
            test-file: scenarios/soak-test.js
            max-duration: 80m

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: |
          cd 3d-virtual-nlu
          npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Maven
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build backend
        run: |
          cd 3d-virtual-nlu-api
          mvn clean compile -DskipTests

      - name: Setup K6
        uses: grafana/k6-action@v0.3.0
        with:
          filename: k6-performance-tests/${{ matrix.test-file }}
          flags:
            --env API_BASE_URL=${{ secrets.STAGING_API_URL || 'http://localhost:8080/app/api' }}
            --env TEST_USER_USERNAME=${{ secrets.TEST_USER_USERNAME }}
            --env TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }}
            --env TEST_ADMIN_USERNAME=${{ secrets.TEST_ADMIN_USERNAME }}
            --env TEST_ADMIN_PASSWORD=${{ secrets.TEST_ADMIN_PASSWORD }}
            --out json=results/${{ matrix.test-scenario }}-results.json
            --out influxdb=${{ secrets.INFLUXDB_URL }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.test-scenario }}-results
          path: results/
          retention-days: 30

      - name: Parse and analyze results
        if: always()
        run: |
          echo "Analyzing ${{ matrix.test-scenario }} results..."
          if [ -f "results/${{ matrix.test-scenario }}-results.json" ]; then
            echo "Test results found"
            # Add result analysis logic here
          else
            echo "No test results found"
          fi

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `results/${context.job}-results.json`;

            if (fs.existsSync(path)) {
              const results = JSON.parse(fs.readFileSync(path, 'utf8'));
              const metrics = results.metrics;
              
              const comment = `## Performance Test Results: ${{ matrix.test-scenario }}
              
              ### Key Metrics:
              - **HTTP Request Duration (p95)**: ${metrics.http_req_duration?.values?.p95 || 'N/A'} ms
              - **HTTP Request Failed Rate**: ${(metrics.http_req_failed?.values?.rate * 100 || 0).toFixed(2)}%
              - **Total Requests**: ${metrics.http_reqs?.values?.count || 0}
              - **Test Duration**: ${metrics.iteration_duration?.values?.max || 0} ms
              
              ### Status: ${metrics.http_req_failed?.values?.rate > 0.1 ? '❌ Failed' : '✅ Passed'}
              
              [View detailed results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  performance-dashboard:
    needs: performance-tests
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate performance report
        run: |
          echo "Generating performance test summary..."
          # Add report generation logic here
          echo "## Performance Test Summary" >> performance-report.md
          echo "All tests completed. Check individual job results for details." >> performance-report.md

      - name: Upload performance report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance-report.md
          retention-days: 90

  notify-failure:
    needs: performance-tests
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Notify on failure
        run: |
          echo "Performance tests failed!"
          # Add notification logic (Slack, email, etc.)
          echo "Check the workflow run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
